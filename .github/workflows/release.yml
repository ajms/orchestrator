name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Pick tag
        id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: echo "tag=$(jq -r '.[] | select(.package_name == "orch") | .tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        if: steps.tag.outputs.tag

      - name: Build and upload
        if: steps.tag.outputs.tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cargo build --release --locked -p orch
          archive="orch-$TAG-$TARGET.tar.gz"
          tar -czf "$archive" -C target/release orch
          gh release upload "$TAG" "$archive"

  release-pr:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
