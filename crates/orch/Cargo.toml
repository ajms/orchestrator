[package]
name = "orch"
version.workspace = true
edition.workspace = true

[dependencies]
orch-core.workspace = true
orch-agent.workspace = true
orch-config = { path = "../orch-config" }
orch-holder.workspace = true
clap = { version = "4", features = ["derive"] }
nix = { version = "0.30", features = ["term", "signal"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
vt100 = "0.16"
