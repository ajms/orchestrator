[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
orch-core = { path = "crates/orch-core" }
orch-agent = { path = "crates/orch-agent" }
orch-holder = { path = "crates/orch-holder" }
orch-term = { path = "crates/orch-term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
